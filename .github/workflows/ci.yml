name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Syntax + smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Parse every script
        run: npm run check

      - name: Boot the app and walk every screen
        run: npm test
