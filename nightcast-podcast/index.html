<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08060d"><title>Nightcast Podcast Studio</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div><span class="eyebrow">NIGHTCAST PODCAST</span><h1>Podcast Studio</h1><p>Build a cast, generate an episode, hear it spoken, and save your podcast locally.</p></div><button id="newBtn">＋ New Episode</button></header>
<section class="panel active"><div class="grid"><div><label>Episode title<input id="title" placeholder="The Midnight Interview"></label><label>Topic / premise<textarea id="topic" placeholder="What should the cast discuss?"></textarea></label><div class="row"><label>Format<select id="format"><option>Interview</option><option>Co-Host</option><option>Panel</option><option>Deep Dive</option></select></label><label>Length<select id="length"><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="20">20 min</option><option value="30">30 min</option></select></label><label>Tone<select id="tone"><option>Natural</option><option>Funny</option><option>Dark</option><option>Argumentative</option><option>Warm</option></select></label></div><button id="generate" class="primary">Generate Podcast</button><button id="aiGenerate" class="secondary">✨ Generate with Gemini</button></div>
<aside><h2>Cast</h2><div id="cast"></div><button id="addCast" class="secondary">＋ Add character</button><button id="manageCast" class="secondary">Edit cast</button></aside></div>
<div id="player" class="player hidden"><div class="now"><span id="speaker">Ready</span><strong id="line">Generate an episode to begin.</strong></div><div class="controls"><button id="play">▶ Play</button><button id="stop">■ Stop</button><button id="save">Save Episode</button><button id="download">Download TXT</button><button id="gemini" class="secondary">✨ Gemini Pack</button></div><pre id="transcript"></pre></div></section>
<section class="library panel"><div class="sectionHead"><div><h2>Saved Episodes</h2><p>Stored locally on this device.</p></div><button id="exportAll" class="secondary">Export Library</button></div><div id="episodeList" class="cards"></div></section>
<dialog id="charDialog"><form method="dialog" id="charForm"><h2>Podcast Character</h2><input type="hidden" id="charId"><label>Name<input id="charName" required></label><label>Bio<textarea id="charBio"></textarea></label><label>Personality<textarea id="charPersonality" placeholder="sarcastic, curious, guarded"></textarea></label><label>Speaking style<input id="charStyle" placeholder="fast, dry, poetic"></label><label>Catchphrase<input id="charCatch"></label><label>Voice<select id="charVoice"></select></label><div class="row"><label>Rate<input id="charRate" type="number" min="0.5" max="2" step="0.05" value=".95"></label><label>Pitch<input id="charPitch" type="number" min="0" max="2" step=".1" value="1"></label></div><div class="dialogBtns"><button value="cancel">Cancel</button><button type="button" id="previewVoice">Preview Voice</button><button id="charSubmit" value="default" class="primary">Save Character</button></div></form></dialog>
<script src="app.js"></script></main></body></html>
